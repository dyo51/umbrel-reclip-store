version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: unless-stopped
    environment:
      APP_HOST: custom-store-legendary-osint_server_1
      APP_PORT: 80
    depends_on:
      - server

  server:
    image: ghcr.io/dyo51/custom-store-osint-reader:1.0.0@sha256:dc7c523bdbe5cbd7b5fde7b1f70cd3cf88ed31375b1b2ed14cf92be795f09780
    restart: unless-stopped
    environment:
      SITE: legendary
