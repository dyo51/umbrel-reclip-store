name: Test and publish OSINT reader image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/osint-reader.yml
      - osint-reader/**

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Custom store
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests and JavaScript checks
        run: npm test && npm run check
        working-directory: osint-reader

      - name: Validate Umbrel Compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f custom-store-legendary-osint/docker-compose.yml config --quiet
          docker compose -f custom-store-awesome-osint/docker-compose.yml config --quiet

      - name: Validate package identity and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for entry in custom-store-legendary-osint:legendary custom-store-awesome-osint:awesome; do
            app_id="${entry%%:*}"
            site="${entry##*:}"
            grep -Fq "id: ${app_id}" "${app_id}/umbrel-app.yml"
            grep -Fq "APP_HOST: ${app_id}_server_1" "${app_id}/docker-compose.yml"
            grep -Fq "APP_PORT: 80" "${app_id}/docker-compose.yml"
            grep -Fq "SITE: ${site}" "${app_id}/docker-compose.yml"
          done

      - name: Build local smoke image
        run: docker build --pull -t local/custom-store-osint-reader:${{ github.sha }} ./osint-reader

      - name: Smoke both site variants and validate Nginx
        shell: bash
        env:
          IMAGE: local/custom-store-osint-reader:${{ github.sha }}
        run: |
          set -euo pipefail
          for site in legendary awesome; do
            expected="Legendary OSINT"
            if [ "$site" = "awesome" ]; then expected="Awesome OSINT"; fi
            cid=$(docker run -d --env SITE="$site" -p 127.0.0.1::80 "$IMAGE")
            cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            port=$(docker port "$cid" 80/tcp | sed -E 's/.*:([0-9]+)$/\1/')
            base="http://127.0.0.1:${port}"
            ready=false
            for attempt in $(seq 1 20); do
              if curl -fsS "${base}/healthz" >/dev/null; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            test "$(curl -fsS "${base}/healthz")" = "ok"
            curl -fsS "${base}/config.json" | grep -Fq "\"title\": \"${expected}\""
            curl -fsS "${base}/icon.png" >/dev/null
            test "$(curl -s -o /dev/null -w '%{http_code}' "${base}/configs/awesome.json")" = "404"
            test "$(curl -s -o /dev/null -w '%{http_code}' "${base}/assets/legendary-osint.png")" = "404"
            curl -fsS "${base}/" | grep -Fq "OSINT"
            docker exec "$cid" nginx -t
            cleanup
            trap - EXIT
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish shared OSINT reader
        id: publish_image
        uses: docker/build-push-action@v6
        with:
          context: ./osint-reader
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/custom-store-osint-reader:1.0.0
            ghcr.io/${{ github.repository_owner }}/custom-store-osint-reader:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/custom-store-osint-reader:latest
          labels: |
            org.opencontainers.image.title=Custom Store OSINT Reader
            org.opencontainers.image.description=Stateless, read-only Umbrel reader for public OSINT reference catalogs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: |
          printf 'Published image digest: `%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
