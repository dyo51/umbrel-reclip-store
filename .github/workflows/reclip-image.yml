name: Publish Reclip container image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/reclip-image.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout store repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream Reclip source
        uses: actions/checkout@v4
        with:
          repository: averygan/reclip
          ref: 1d161d15a4fe93d9b3371377f0a421dc3e965b10
          path: upstream/reclip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Reclip image
        uses: docker/build-push-action@v6
        with:
          context: upstream/reclip
          file: upstream/reclip/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/custom-store-reclip:upstream-1d161d15a4fe93d9b3371377f0a421dc3e965b10
            ghcr.io/${{ github.repository_owner }}/custom-store-reclip:latest
          labels: |
            org.opencontainers.image.title=Reclip
            org.opencontainers.image.description=Reclip image for the Umbrel custom-store package
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=1d161d15a4fe93d9b3371377f0a421dc3e965b10
