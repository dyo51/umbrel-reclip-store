location = /source/README.md {
    limit_except GET { deny all; }
    # The empty query marker prevents forwarding caller-supplied parameters.
    proxy_pass https://raw.githubusercontent.com/K2SOsint/Legendary_OSINT/main/README.md?;
}

location ~ ^/source/docs/(?<doc>[A-Za-z0-9_][A-Za-z0-9._-]*(?:/[A-Za-z0-9_][A-Za-z0-9._-]*)*\.md)$ {
    limit_except GET { deny all; }
    # Paths are constrained to Markdown files in the fixed upstream repository.
    # The empty query marker prevents forwarding caller-supplied parameters.
    proxy_pass https://raw.githubusercontent.com/K2SOsint/Legendary_OSINT/main/docs/$doc?;
}

location /source/ {
    return 404;
}
