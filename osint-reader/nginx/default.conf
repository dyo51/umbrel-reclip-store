server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-store" always;

    resolver 127.0.0.11 valid=60s ipv6=off;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_set_header Accept text/plain;
    proxy_set_header Accept-Encoding "";
    proxy_set_header User-Agent "Custom-Store-OSINT-Reader/1.0";
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name raw.githubusercontent.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 5;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 12s;
    proxy_buffering off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /configs/ {
        return 404;
    }

    location ^~ /assets/ {
        return 404;
    }

    include /etc/nginx/snippets/osint-source.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
