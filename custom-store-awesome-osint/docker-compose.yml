version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: unless-stopped
    environment:
      APP_HOST: custom-store-awesome-osint_server_1
      APP_PORT: 80
    depends_on:
      - server

  server:
    image: ghcr.io/dyo51/custom-store-osint-reader:1.0.0@sha256:dad249584d7dfefa4c526b34fa5e3a82bb63c8092dfb3d907876f586e15c360e
    restart: unless-stopped
    environment:
      SITE: awesome
